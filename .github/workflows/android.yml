name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: platforms;android-36
  ANDROID_BUILD_TOOLS: build-tools;35.0.0

jobs:
  test:
    name: DSP unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core-dsp tests
        run: ./gradlew --stacktrace :core-dsp:test

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK platform
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stemsep-signing.jks"
            echo "STEMSEP_KEYSTORE_FILE=$RUNNER_TEMP/stemsep-signing.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret; falling back to the ephemeral debug key."
          fi

      - name: Run separation unit tests
        run: ./gradlew --stacktrace :separation:testDebugUnitTest

      - name: Build
        env:
          STEMSEP_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          STEMSEP_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STEMSEP_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STEMSEP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: stemsep-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to the latest release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/StemSep-debug.apk"
          NOTES="Automatic debug build from ${GITHUB_SHA::12} on ${GITHUB_REF_NAME}. Package: app.stemsep.debug. CPU inference is default; Snapdragon GPU/NPU via NNAPI is experimental. Live separated vocals are available while separation runs, with requested/active backend and fallback status in the UI. The first separation downloads the selected ONNX model."
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "$RUNNER_TEMP/StemSep-debug.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create latest "$RUNNER_TEMP/StemSep-debug.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest debug build" \
              --notes "$NOTES"
          fi
